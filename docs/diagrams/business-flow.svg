<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t d">
<title id="t">ShellCycle 业务闭环</title><desc id="d">回收、调度、称重、熟化、检验、库存预留、发运、签收、投放与异常退回。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#087f83"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#12313e}.h{font-size:21px;font-weight:700}.p{font-size:16px}.b{fill:white;stroke:#8bb5bd;stroke-width:2;rx:12}.l{fill:none;stroke:#087f83;stroke-width:3;marker-end:url(#a)}.e{fill:#fff4dd;stroke:#d5a548;stroke-width:2;rx:12}</style></defs>
<rect width="1200" height="790" fill="#f1f7f8"/><text x="45" y="55" style="font-size:30px;font-weight:700">ShellCycle / 业务闭环与质量控制</text><text x="45" y="88" class="p">实物流、质量状态、数量账同步推进；异常留证据，不直接修改余额掩盖问题。</text>
<rect x="45" y="130" width="240" height="100" class="b"/><text x="65" y="165" class="h">01 餐厅回收申请</text><text x="65" y="198" class="p">预计重量 / 日期 / 桶数</text><text x="65" y="219" class="p">批量导入外部编号去重</text>
<rect x="350" y="130" width="240" height="100" class="b"/><text x="370" y="165" class="h">02 调度与收取</text><text x="370" y="198" class="p">车辆 / 线路 / 实际量</text><text x="370" y="219" class="p">失败、改派、改期留痕</text>
<rect x="655" y="130" width="240" height="100" class="b"/><text x="675" y="165" class="h">03 称重接收</text><text x="675" y="198" class="p">毛重 − 皮重 − 拒收量</text><text x="675" y="219" class="p">更正不能低于已投料量</text><path d="M285 180H342M590 180H647" class="l"/>
<rect x="655" y="305" width="240" height="110" class="b"/><text x="675" y="341" class="h">04 投料封批熟化</text><text x="675" y="374" class="p">接收单与批次建立关联</text><text x="675" y="399" class="p">固定规则 / 封批禁止投料</text><path d="M775 230V297" class="l"/>
<rect x="350" y="305" width="240" height="110" class="b"/><text x="370" y="341" class="h">05 检验与放行</text><text x="370" y="374" class="p">到期 + 最新检验合格</text><text x="370" y="399" class="p">质量角色执行，非自动放行</text><path d="M655 360H598" class="l"/>
<rect x="45" y="305" width="240" height="110" class="e"/><text x="65" y="341" class="h">隔离 / 不合格 / 未到期</text><text x="65" y="374" class="p">禁止发运，冻结未发运预留</text><text x="65" y="399" class="p">满足条件后复检放行</text><path d="M350 360H293M165 415V450H470V423" class="l"/>
<rect x="350" y="510" width="240" height="100" class="b"/><text x="370" y="546" class="h">06 需求与预留</text><text x="370" y="578" class="p">占可用量，不扣实物</text><text x="370" y="600" class="p">不得超需求或超库存</text><path d="M470 450V502" class="l"/>
<rect x="655" y="510" width="240" height="100" class="b"/><text x="675" y="546" class="h">07 发运与签收</text><text x="675" y="578" class="p">发运扣实物，签收记差异</text><text x="675" y="600" class="p">可分次，不能超额</text><path d="M590 560H647" class="l"/>
<rect x="945" y="510" width="210" height="100" class="b"/><text x="963" y="546" class="h">08 现场投放</text><text x="963" y="578" class="p">日期 / 地点 / 实际量</text><text x="963" y="600" class="p">受未投放签收量约束</text><path d="M895 560H937" class="l"/>
<rect x="945" y="305" width="210" height="110" class="e"/><text x="963" y="341" class="h">未投放物料退回</text><text x="963" y="374" class="p">申请 → 他人审批 → 回库</text><text x="963" y="399" class="p">隔离并重新检验</text><path d="M895 535H920V360H937M1050 305V265H165V297" class="l"/>
<rect x="45" y="665" width="1110" height="90" rx="12" fill="#12313e"/><text x="70" y="701" style="font-size:22px;font-weight:700;fill:white">批次溯源 · 整数克计量 · 库存流水 · 幂等与事务 · 权限与操作审计</text><text x="70" y="736" style="font-size:17px;fill:#bce3e5">来源可追、状态可控、数量可核、异常可处理。教学规则不替代真实环境法规与工程判断。</text>
</svg>
